<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <!-- Definicije stilova i gradijenata -->
  <defs>
    <style>
      .bg-trans { fill: none; }
      .pocket-line { fill: none; stroke: #2E7D32; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .pocket-fill { fill: #E8F5E9; }
      .stall-roof { fill: #4CAF50; }
      .stall-stripe { fill: #FFFFFF; }
      .stall-structure { stroke: #2E7D32; stroke-width: 3; fill: none; stroke-linecap: round; }
      .fruit-apple { fill: #E53935; }
      .fruit-leaf { fill: #81C784; }
      .fruit-orange { fill: #FB8C00; }
      .text-primary { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #1B5E20; }
      .text-secondary { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 42px; fill: #4CAF50; }
    </style>
  </defs>

  <!-- Grupa za Ikonu (Tezga u Džepu) -->
  <g transform="translate(10, 5)">
    <!-- Džep (Telo džepa) -->
    <path class="pocket-fill" d="M 20 50 L 20 85 C 20 100, 30 110, 55 110 C 80 110, 90 100, 90 85 L 90 50 Z" />

    <!-- Pijačna Tezga (Viri iz džepa) -->
    <!-- Prodajni pult / Voće -->
    <path class="fruit-orange" d="M 38 48 A 8 8 0 0 1 54 48 Z" />
    <path class="fruit-apple" d="M 52 48 A 9 9 0 0 1 70 48 Z" />
    <path class="fruit-leaf" d="M 62 37 C 62 32, 67 30, 70 32 C 70 35, 67 38, 62 37 Z" />

    <!-- Stubovi tezge -->
    <line class="stall-structure" x1="28" y1="22" x2="28" y2="50" />
    <line class="stall-structure" x1="82" y1="22" x2="82" y2="50" />
    <line class="stall-structure" x1="24" y1="50" x2="86" y2="50" />

    <!-- Krov tezge (Tenda) -->
    <path class="stall-roof" d="M 22 22 L 88 22 L 83 10 L 27 10 Z" />
    <!-- Pruge na tendi -->
    <path class="stall-stripe" d="M 35 10 L 38 22 L 48 22 L 43 10 Z" />
    <path class="stall-stripe" d="M 53 10 L 56 22 L 66 22 L 61 10 Z" />
    <path class="stall-stripe" d="M 71 10 L 74 22 L 81 22 L 77 10 Z" />

    <!-- Kontura Džepa i šavovi -->
    <path class="pocket-line" d="M 15 50 L 95 50" />
    <path class="pocket-line" d="M 20 50 L 20 85 C 20 100, 30 110, 55 110 C 80 110, 90 100, 90 85 L 90 50" />
    <!-- Stilizovani šav na džepu -->
    <path d="M 25 55 L 85 55" stroke="#81C784" stroke-width="2" stroke-dasharray="3,3" fill="none" />
  </g>

  <!-- Tipografija / Naziv brenda -->
  <g transform="translate(125, 73)">
    <text class="text-primary" x="0" y="0">Pijaca</text>
    <text class="text-secondary" x="130" y="0">u Džepu</text>
  </g>
</svg>