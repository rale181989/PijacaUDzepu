<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Moji proizvodi</ion-title>
    <ion-buttons slot="end">
      <app-orders-button></app-orders-button>
      <ion-button routerLink="/vendor-product-form">
        <ion-icon name="add-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ion-spinner *ngIf="loading" name="crescent" class="center-spinner"></ion-spinner>

  <div *ngIf="!loading && products.length === 0" class="empty-state">
    <ion-icon name="leaf-outline" size="large"></ion-icon>
    <p>Nemate proizvode</p>
    <ion-button routerLink="/vendor-product-form">Dodaj prvi proizvod</ion-button>
  </div>

  <ion-list *ngIf="!loading">
    <ion-item-sliding *ngFor="let product of products">
      <ion-item [routerLink]="['/vendor-product-form', product.id]">
        <ion-thumbnail slot="start">
          <img [src]="getImageUrl(product.imageUrl)" [alt]="product.name" />
        </ion-thumbnail>
        <ion-label>
          <h2>{{ product.name }}</h2>
          <p>{{ product.price | number:'1.0-0' }} din/{{ getUnitLabel(product.unit) }}
            <span *ngIf="product.stockQuantity != null" class="stock" [class.low]="product.stockQuantity <= 3">
              · na stanju {{ product.stockQuantity | number:'1.0-2' }} {{ getUnitLabel(product.unit) }}
            </span>
          </p>
        </ion-label>
        <ion-button slot="end" fill="clear" size="small" (click)="quickEdit(product, $event)" title="Brza izmena cene i stanja">
          <ion-icon name="pricetag-outline" slot="icon-only"></ion-icon>
        </ion-button>
        <ion-toggle slot="end" [checked]="product.isAvailable"
                    (ionChange)="toggleAvailability(product)"
                    (click)="$event.stopPropagation(); $event.preventDefault()">
        </ion-toggle>
      </ion-item>
      <ion-item-options side="end">
        <ion-item-option color="danger" (click)="confirmDelete(product)">
          <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button routerLink="/vendor-product-form">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
