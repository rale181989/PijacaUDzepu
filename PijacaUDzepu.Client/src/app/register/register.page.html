<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login"></ion-back-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <app-cart-button></app-cart-button>
    </ion-buttons>
    <ion-title>{{ 'register.title' | t }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="register-container">
    <form (ngSubmit)="register()">
      <ion-item>
        <ion-input [label]="'register.firstName' | t" labelPlacement="floating"
                   [(ngModel)]="model.firstName" name="firstName" required></ion-input>
      </ion-item>
      <ion-item>
        <ion-input [label]="'register.lastName' | t" labelPlacement="floating"
                   [(ngModel)]="model.lastName" name="lastName" required></ion-input>
      </ion-item>
      <ion-item>
        <ion-input [label]="'register.username' | t" labelPlacement="floating"
                   [(ngModel)]="model.userName" name="userName" required></ion-input>
      </ion-item>
      <ion-item>
        <ion-input [label]="'register.password' | t" labelPlacement="floating" type="password"
                   [(ngModel)]="model.password" name="password" required minlength="4"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input [label]="'register.phone' | t" labelPlacement="floating" type="tel"
                   [(ngModel)]="model.phoneNumber" name="phoneNumber"></ion-input>
      </ion-item>

      <ion-button expand="block" type="submit" [disabled]="loading" class="ion-margin-top">
        <ion-spinner *ngIf="loading" name="crescent" slot="start"></ion-spinner>
        {{ 'register.submit' | t }}
      </ion-button>
    </form>

    <p class="ion-text-center ion-margin-top">
      {{ 'register.hasAccount' | t }} <a routerLink="/login">{{ 'register.login' | t }}</a>
    </p>
  </div>

  <app-footer></app-footer>
</ion-content>
