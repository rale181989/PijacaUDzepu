<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login"></ion-back-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <app-orders-button></app-orders-button>
      <app-cart-button></app-cart-button>
    </ion-buttons>
    <ion-title>{{ 'register.title' | t }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="register-container">
    <form (ngSubmit)="register()">
      <ion-item>
        <ion-input [label]="'register.firstName' | t" labelPlacement="floating"
                   [(ngModel)]="model.firstName" name="firstName" required></ion-input>
      </ion-item>
      <ion-item>
        <ion-input [label]="'register.lastName' | t" labelPlacement="floating"
                   [(ngModel)]="model.lastName" name="lastName" required></ion-input>
      </ion-item>
      <ion-item>
        <ion-input [label]="'register.username' | t" labelPlacement="floating"
                   [(ngModel)]="model.userName" name="userName" required></ion-input>
      </ion-item>
      <ion-item>
        <ion-input [label]="'register.password' | t" labelPlacement="floating" type="password"
                   [(ngModel)]="model.password" name="password" required minlength="8"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input [label]="'register.phone' | t" labelPlacement="floating" type="tel"
                   [(ngModel)]="model.phoneNumber" name="phoneNumber" required></ion-input>
      </ion-item>
      <ion-item>
        <ion-input [label]="'register.address' | t" labelPlacement="floating"
                   [placeholder]="'cart.addressPlaceholder' | t"
                   [(ngModel)]="model.address" name="address" required></ion-input>
      </ion-item>
      <div class="row">
        <ion-item>
          <ion-input [label]="'register.floor' | t" labelPlacement="floating"
                     [(ngModel)]="model.floor" name="floor" maxlength="20"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input [label]="'register.apartment' | t" labelPlacement="floating"
                     [(ngModel)]="model.apartment" name="apartment" maxlength="20"></ion-input>
        </ion-item>
      </div>
      <p class="hint">{{ 'register.addressHint' | t }}</p>

      <ion-button expand="block" type="submit" [disabled]="!canSubmit" class="ion-margin-top">
        <ion-spinner *ngIf="loading" name="crescent" slot="start"></ion-spinner>
        {{ 'register.submit' | t }}
      </ion-button>
    </form>

    <p class="ion-text-center ion-margin-top">
      {{ 'register.hasAccount' | t }} <a routerLink="/login">{{ 'register.login' | t }}</a>
    </p>
  </div>

  <app-footer></app-footer>
</ion-content>
