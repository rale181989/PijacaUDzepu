<footer class="site-footer">
  <nav class="footer-links">
    <a routerLink="/legal/terms" routerLinkActive="active">{{ 'footer.terms' | t }}</a>
    <a routerLink="/legal/privacy" routerLinkActive="active">{{ 'footer.privacy' | t }}</a>
    <a routerLink="/legal/cookies" routerLinkActive="active">{{ 'footer.cookies' | t }}</a>
    <a routerLink="/legal/about" routerLinkActive="active">{{ 'footer.about' | t }}</a>
  </nav>
  <p class="footer-support">
    {{ 'footer.support' | t }}: <a routerLink="/podrska">{{ 'footer.askQuestion' | t }}</a> · <a [href]="'mailto:' + supportEmail">{{ supportEmail }}</a>
  </p>
  <p class="footer-copy">&copy; {{ year }} {{ 'app.title' | t }}. {{ 'footer.rights' | t }}</p>
</footer>
