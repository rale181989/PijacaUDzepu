<ol class="progress">
  @for (step of steps; track step; let i = $index) {
    <li [class.done]="step.done" [class.current]="i === currentIndex">
      <span class="dot">
        @if (step.done) {
          <ion-icon name="checkmark"></ion-icon>
        }
      </span>
      <div class="text">
        <strong>{{ step.key | t }}</strong>
        @if (step.detail) {
          <span class="detail"> · {{ step.detail }}</span>
        }
        @if (step.done && step.time) {
          <span class="time">{{ step.time | date:'dd.MM. HH:mm' }}</span>
        }
      </div>
    </li>
  }
</ol>
