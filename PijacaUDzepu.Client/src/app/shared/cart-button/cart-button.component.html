@if (!authService.isStaff) {
  <ion-button routerLink="/cart" routerDirection="root" [attr.aria-label]="'nav.cart' | t">
    <ion-icon name="cart-outline" slot="icon-only"></ion-icon>
    @if (count > 0) {
      <span class="cart-count">{{ count > 99 ? '99+' : count }}</span>
    }
  </ion-button>
}
