<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>{{ 'reset.title' | t }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="narrow">
    <div *ngIf="!token" class="message">
      <ion-icon name="alert-circle-outline"></ion-icon>
      <p>{{ 'reset.invalid' | t }} <a routerLink="/forgot-password">{{ 'login.forgot' | t }}</a></p>
    </div>

    <form *ngIf="token" (ngSubmit)="submit()">
      <ion-item>
        <ion-input [label]="'reset.password' | t" labelPlacement="floating" type="password"
                   [(ngModel)]="password" name="password" required minlength="8"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input [label]="'reset.confirm' | t" labelPlacement="floating" type="password"
                   [(ngModel)]="confirm" name="confirm" required></ion-input>
      </ion-item>
      <p *ngIf="confirm && !passwordsMatch" class="error-text">{{ 'reset.mismatch' | t }}</p>
      <p *ngIf="error" class="error-text">{{ error }}
        <a *ngIf="error.includes('istekao')" routerLink="/forgot-password">{{ 'login.forgot' | t }}</a></p>
      <ion-button expand="block" type="submit" [disabled]="!canSubmit" class="ion-margin-top">
        <ion-spinner *ngIf="loading" name="crescent" slot="start"></ion-spinner>
        {{ 'reset.submit' | t }}
      </ion-button>
    </form>
  </div>
  <app-footer></app-footer>
</ion-content>
