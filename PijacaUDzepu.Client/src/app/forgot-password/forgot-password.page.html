<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>{{ 'forgot.title' | t }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="narrow">
    <ng-container *ngIf="!sent">
      <p class="intro">{{ 'forgot.intro' | t }}</p>
      <form (ngSubmit)="submit()">
        <ion-item>
          <ion-input [label]="'forgot.login' | t" labelPlacement="floating" [(ngModel)]="login" name="login" required></ion-input>
        </ion-item>
        <p *ngIf="error" class="error-text">{{ error }}</p>
        <ion-button expand="block" type="submit" [disabled]="loading || !login.trim()" class="ion-margin-top">
          <ion-spinner *ngIf="loading" name="crescent" slot="start"></ion-spinner>
          {{ 'forgot.submit' | t }}
        </ion-button>
      </form>
    </ng-container>

    <div *ngIf="sent" class="message">
      <ion-icon name="mail-outline"></ion-icon>
      <p>{{ 'forgot.sent' | t }}</p>
    </div>

    <p class="intro ion-margin-top">{{ 'forgot.noEmail' | t }} <a routerLink="/podrska">{{ 'nav.support' | t }}</a></p>
    <p class="ion-text-center"><a routerLink="/login">{{ 'forgot.backToLogin' | t }}</a></p>
  </div>
  <app-footer></app-footer>
</ion-content>
