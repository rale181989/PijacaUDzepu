<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <app-orders-button></app-orders-button>
      <app-cart-button></app-cart-button>
    </ion-buttons>
    <ion-title>{{ content.title }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <article class="legal-container">
    <h1>{{ content.title }}</h1>
    <p class="legal-updated">{{ 'legal.updated' | t }}: {{ updated }}</p>

    @for (section of content.sections; track section) {
      <section>
        <h2>{{ section.heading }}</h2>
        @for (paragraph of section.paragraphs; track paragraph) {
          <p>{{ paragraph }}</p>
        }
      </section>
    }
  </article>

  <app-footer></app-footer>
</ion-content>
