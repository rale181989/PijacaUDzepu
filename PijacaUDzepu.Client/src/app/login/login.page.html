<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>{{ 'login.title' | t }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="login-container">
    <ion-icon name="storefront" class="logo-icon" color="primary"></ion-icon>
    <h2>{{ 'app.title' | t }}</h2>

    <form (ngSubmit)="login()">
      <ion-item>
        <ion-input [label]="'login.username' | t" labelPlacement="floating"
                   [(ngModel)]="model.userName" name="userName" required></ion-input>
      </ion-item>

      <ion-item>
        <ion-input [label]="'login.password' | t" labelPlacement="floating" type="password"
                   [(ngModel)]="model.password" name="password" required></ion-input>
      </ion-item>

      <ion-button expand="block" type="submit" [disabled]="loading" class="ion-margin-top">
        <ion-spinner *ngIf="loading" name="crescent" slot="start"></ion-spinner>
        {{ 'login.submit' | t }}
      </ion-button>
    </form>

    <p class="ion-text-center ion-margin-top">
      {{ 'login.noAccount' | t }} <a routerLink="/register">{{ 'login.register' | t }}</a>
    </p>

    <p *ngIf="serverSelectable" class="server-setting">
      <ion-icon name="server-outline"></ion-icon>
      Server: {{ isDefaultServer ? 'Render' : apiServer }}
      <a (click)="chooseServer()">Promeni</a>
    </p>
  </div>

  <app-footer></app-footer>
</ion-content>
