<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Moji podaci</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-spinner *ngIf="loading" name="crescent" class="center-spinner"></ion-spinner>

  <form *ngIf="!loading" (ngSubmit)="save()">
    <p class="username">Korisničko ime: <strong>{{ userName }}</strong></p>

    <ion-item>
      <ion-input label="Ime" labelPlacement="floating"
                 [(ngModel)]="model.firstName" name="firstName" required></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Prezime" labelPlacement="floating"
                 [(ngModel)]="model.lastName" name="lastName" required></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Telefon" labelPlacement="floating" type="tel"
                 [(ngModel)]="model.phoneNumber" name="phoneNumber" required
                 helperText="Prodavac i kupac vide ovaj broj kada prihvatite porudžbinu"></ion-input>
    </ion-item>
    <ion-item>
      <ion-select label="Prevozno sredstvo" labelPlacement="floating"
                  [(ngModel)]="model.vehicle" name="vehicle" interface="popover">
        <ion-select-option [value]="null">-- Nije izabrano --</ion-select-option>
        <ion-select-option *ngFor="let v of vehicles" [value]="v.value">{{ v.label }}</ion-select-option>
      </ion-select>
    </ion-item>
    <ion-item>
      <ion-input label="Registarska oznaka (opciono)" labelPlacement="floating"
                 [(ngModel)]="model.licensePlate" name="licensePlate" maxlength="20"
                 placeholder="npr. NS 123-AB"></ion-input>
    </ion-item>

    <ion-button expand="block" type="submit" [disabled]="saving || !canSave" class="ion-margin-top">
      <ion-spinner *ngIf="saving" name="crescent" slot="start"></ion-spinner>
      Sačuvaj
    </ion-button>
  </form>

  <div *ngIf="!loading" class="password-section">
    <h3>Promena lozinke</h3>
    <form (ngSubmit)="changePassword()">
      <ion-item>
        <ion-input label="Trenutna lozinka" labelPlacement="floating" type="password"
                   [(ngModel)]="currentPassword" name="currentPassword" required></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Nova lozinka" labelPlacement="floating" type="password"
                   [(ngModel)]="newPassword" name="newPassword" required minlength="4"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Potvrdite novu lozinku" labelPlacement="floating" type="password"
                   [(ngModel)]="confirmPassword" name="confirmPassword" required></ion-input>
      </ion-item>
      <p *ngIf="confirmPassword && !passwordsMatch" class="error-text">Lozinke se ne poklapaju</p>
      <ion-button expand="block" type="submit"
                  [disabled]="changingPassword || !currentPassword || !newPassword || !confirmPassword || !passwordsMatch || newPassword.length < 4"
                  class="ion-margin-top">
        <ion-spinner *ngIf="changingPassword" name="crescent" slot="start"></ion-spinner>
        Promeni lozinku
      </ion-button>
    </form>
  </div>
</ion-content>
